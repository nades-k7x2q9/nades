<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS2 Nades</title>
<style>
:root{--bg:#14171c;--panel:#1c2128;--line:#2e3641;--txt:#e9edf2;--dim:#98a3b3;--ct:#5aa9ff;--t:#f2b53a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px;display:grid;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.sep{width:14px}
button{font:inherit;color:var(--txt);background:#262d38;border:1px solid var(--line);border-radius:5px;padding:7px 13px;cursor:pointer}
button:hover{background:#323b49}
button.on{background:var(--acc,#3d7de8);border-color:transparent;color:#fff;font-weight:600}
#maps button{flex:1 1 0;min-width:72px}
#side button{min-width:56px}
#side [data-v=ct]{--acc:var(--ct);color:var(--txt)}
#side [data-v=t]{--acc:var(--t)}
#side [data-v=t].on,#side [data-v=ct].on{color:#101318}
#loc button{min-width:64px}
main{padding:10px 12px 48px;max-width:1800px;margin:0 auto}
nav{margin-bottom:14px}
nav button{padding:4px 10px;font-size:13px}
article{margin:0 0 24px;scroll-margin-top:100px}
h3{font-size:17px;font-weight:600;margin:0 0 8px}
.shots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.shots img{display:block;width:100%;aspect-ratio:auto 16/9;border-radius:5px;background:#000;cursor:zoom-in}
.handle{padding:4px 10px;font-size:12px;border:1px solid var(--line);border-radius:5px;background:#262d38;cursor:grab;user-select:none}
.dragging{opacity:.4}
.drop-before{box-shadow:0 -4px 0 var(--ct)}
.drop-after{box-shadow:0 4px 0 var(--ct)}
.shots img.drop-before{box-shadow:-5px 0 0 var(--ct)}
.shots img.drop-after{box-shadow:5px 0 0 var(--ct)}
.msg{color:var(--dim)}
#lb{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.92);display:grid;place-items:center;cursor:zoom-out}
#lb img{max-width:98vw;max-height:98vh}
#draft{margin:10px 12px;padding:10px 12px;border:2px dashed #3b4656;border-radius:8px;background:#181d24}
#draft p{margin:0 0 8px;color:var(--dim)}
#dt{width:100%;margin-bottom:10px;padding:9px 11px;font:600 17px "Segoe UI",system-ui,sans-serif;color:var(--txt);background:#0e1115;border:1px solid var(--line);border-radius:5px}
</style></head>
<body>
<header>
  <div class="row" id="maps"></div>
  <div class="row"><span class="row" id="side"></span><span class="sep"></span><span class="row" id="loc"></span></div>
</header>
<section id="draft" hidden>
  <p id="dh"></p>
  <div id="df" hidden>
    <input id="dt" placeholder="Lineup title (one line)">
    <div class="shots" id="dth"></div>
    <div class="row" style="margin-top:10px"><button id="ds">Save lineup</button><button id="dc">Cancel</button><button id="dk">Reset token</button></div>
  </div>
</section>
<main id="out"></main>
<div id="lb" hidden><img alt=""></div>
<script>
// Edit this list to change the map pool (folder/file names must match: maps/<id>.html, img/<id>/)
const MAPS=[["mirage","Mirage"],["inferno","Inferno"],["nuke","Nuke"],["ancient","Ancient"],["dust2","Dust II"],["anubis","Anubis"],["cache","Cache"],["vertigo","Vertigo"]];
const SIDES=[["ct","CT"],["t","T"]], LOCS=[["instant","Instant"],["a","A"],["b","B"],["mid","Mid"]];
const $=s=>document.querySelector(s), docs={}, ids=a=>a.map(x=>x[0]);
let st={map:"mirage",side:"t",loc:"instant"}, tok=0, group=[], gi=0, keepY=null, local={};   // local: repo path -> blob URL of just-uploaded images (shown until the site rebuilds)

function mk(box,list,key){
  list.forEach(([v,l])=>{const b=document.createElement("button");b.textContent=l;b.dataset.v=v;
    b.onclick=()=>go({[key]:v});$(box).append(b)});
}
mk("#maps",MAPS,"map");mk("#side",SIDES,"side");mk("#loc",LOCS,"loc");

function go(p){const n={...st,...p};location.hash=`${n.map}/${n.side}/${n.loc}`}
function parse(){
  const [m,s,l]=location.hash.slice(1).split("/");
  if(ids(MAPS).includes(m))st.map=m; if(ids(SIDES).includes(s))st.side=s; if(ids(LOCS).includes(l))st.loc=l;
}
async function load(m){
  const r=await fetch(`maps/${m}.html`,{cache:"no-cache"}); if(!r.ok)throw 0;
  return new DOMParser().parseFromString(await r.text(),"text/html");
}
function note(t){const p=document.createElement("p");p.className="msg";p.textContent=t;return p}

async function render(){
  parse(); const t=++tok;
  try{localStorage.setItem("nades-last",location.hash)}catch(e){}
  [["#maps","map"],["#side","side"],["#loc","loc"]].forEach(([id,k])=>
    document.querySelectorAll(id+" button").forEach(b=>b.classList.toggle("on",b.dataset.v==st[k])));
  const out=$("#out"); out.replaceChildren();
  let doc;
  try{doc=docs[st.map]||(docs[st.map]=await load(st.map))}
  catch(e){if(t==tok)out.append(note("No file for this map yet: add maps/"+st.map+".html"));return}
  if(t!=tok)return;
  const sec=doc.querySelector(`section[data-side="${st.side}"][data-loc="${st.loc}"]`);
  const arts=sec?[...sec.querySelectorAll("article")]:[];
  if(!arts.length){out.append(note("No lineups here yet."));return}
  const nav=document.createElement("nav");nav.className="row";out.append(nav);
  arts.forEach(a=>{
    const c=a.cloneNode(true);
    c.querySelectorAll("img").forEach(i=>i.loading="lazy");
    if(window.addDel)addDel(c);
    c.querySelectorAll("img").forEach(i=>{const p=i.getAttribute("src");i.dataset.orig=p;const u=local[p];if(u)i.src=u});
    out.append(c);
    const b=document.createElement("button");b.textContent=c.querySelector("h3").textContent;
    b.onclick=()=>c.scrollIntoView({behavior:"smooth"});nav.append(b);
  });
  if(keepY==null)scrollTo(0,0);else{scrollTo(0,keepY);keepY=null}
}

// Click an image to enlarge; click again or press Esc to close; arrow keys flip through that lineup's images
const lb=$("#lb");
function show(){$("#lb img").src=group[gi].src;lb.hidden=false}
document.addEventListener("click",e=>{
  const i=e.target.closest("#out img"); if(!i)return;
  group=[...i.closest("article").querySelectorAll("img")]; gi=group.indexOf(i); show();
});
lb.onclick=()=>lb.hidden=true;

// Keyboard: only used inside the image viewer (Esc / arrows). No key ever changes the page.
addEventListener("keydown",e=>{
  if(lb.hidden||e.ctrlKey||e.altKey||e.metaKey)return;
  const k=e.key.toLowerCase();
  if(k=="escape")lb.hidden=true;
  if(k=="arrowright"){gi=(gi+1)%group.length;show()}
  if(k=="arrowleft"){gi=(gi-1+group.length)%group.length;show()}
});

// ---- Edit mode: drag-drop images, add/rename/delete lineups, saved straight to the repo ----
// TEXTOPS-START
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const b64=s=>{let o="";for(const x of (typeof s=="string"?new TextEncoder().encode(s):s))o+=String.fromCharCode(x);return btoa(o)};
const mkArt=(title,map,names)=>`<article>\n  <h3>${esc(title)}</h3>\n  <div class="shots">\n${names.map(n=>`    <img src="img/${map}/${n}">`).join("\n")}\n  </div>\n</article>\n`;
const addTo=(t,side,loc,art)=>{const o=t.indexOf(`<section data-side="${side}" data-loc="${loc}">`),e=o<0?-1:t.indexOf("</section>",o);
  if(e<0)throw new Error("Section not found in map file");return t.slice(0,e)+art+t.slice(e)};
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const locate=(t,src,title)=>{   // find the <article> block: by image src (any quote style/spacing), else by <h3> title
  const bs=[...t.matchAll(/<article\b[\s\S]*?<\/article>/gi)].map(m=>[m.index,m.index+m[0].length]);
  const sr=new RegExp(`src\\s*=\\s*["']?(?:\\./|/)?(?:${rx(src)}|${rx(esc(src))})(?=["'\\s>/])`,"i");
  let b=bs.find(([a,z])=>sr.test(t.slice(a,z)));
  if(!b&&title){const w=title.trim();
    b=bs.find(([a,z])=>{const m=/<h3[^>]*>([\s\S]*?)<\/h3>/i.exec(t.slice(a,z));return m&&(m[1].trim()==w||m[1].trim()==esc(w))})}
  if(!b)throw new Error("Lineup not found in map file");
  return b};
const dropAt=(t,src,title)=>{const [a,z]=locate(t,src,title);return t.slice(0,a)+t.slice(z).replace(/^\n/,"")};
const moveArt=(t,sa,ta,sb,tb,before)=>{   // move lineup A before/after lineup B
  const [a,z]=locate(t,sa,ta),blk=t.slice(a,z),r=t.slice(0,a)+t.slice(z).replace(/^\n/,""),[c,d]=locate(r,sb,tb);
  return before?r.slice(0,c)+blk+"\n"+r.slice(c):r.slice(0,d)+"\n"+blk+r.slice(d)};
const moveImg=(t,src,title,from,to,n)=>{   // reorder the <img> tags inside one lineup
  const [a,z]=locate(t,src,title),blk=t.slice(a,z),arr=blk.match(/<img\b[^>]*>/gi)||[];
  if(arr.length!=n)throw new Error("Image count in map file differs from the page. Reload and try again");
  arr.splice(to,0,arr.splice(from,1)[0]);let k=0;
  return t.slice(0,a)+blk.replace(/<img\b[^>]*>/gi,()=>arr[k++])+t.slice(z)};
const retitle=(t,src,title,old)=>{const [a,z]=locate(t,src,old),blk=t.slice(a,z),
  nb=blk.replace(/(<h3[^>]*>)[\s\S]*?(<\/h3>)/i,(m,o,c)=>o+esc(title)+c);
  if(!/<h3[^>]*>/i.test(blk))throw new Error("Title not found");return t.slice(0,a)+nb+t.slice(z)};
const norm=s=>{s=s.replace(/&amp;/g,"&");try{s=decodeURIComponent(s)}catch(e){}return s.replace(/^\.?\//,"")};
const srcsOf=h=>[...h.matchAll(/<img\b[^>]*?\bsrc\s*=\s*["']?([^"'\s>]+)/gi)].map(m=>norm(m[1]));
const ownImgs=(t,src,title)=>{   // image files used only by this lineup (safe to delete along with it)
  const [a,z]=locate(t,src,title),keep=new Set(srcsOf(t.slice(0,a)+t.slice(z)));
  return [...new Set(srcsOf(t.slice(a,z)))].filter(p=>/^img\/[^?#]+$/.test(p)&&!p.includes("..")&&!keep.has(p))};
// TEXTOPS-END
const P=new URLSearchParams(location.search), EDIT=!P.has("view")&&P.has("edit"), MAXW=1600;
if(EDIT){
  const R=`${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}`;
  const label=s=>[MAPS,SIDES,LOCS].map((a,i)=>a.find(x=>x[0]==s[["map","side","loc"][i]])[1]).join(" / ");
  let pending=[], dest=null, drag=null;
  const clearMarks=()=>document.querySelectorAll(".drop-before,.drop-after").forEach(x=>x.classList.remove("drop-before","drop-after"));
  $("#draft").hidden=false;
  const say=m=>$("#dh").textContent=m;
  const idle=()=>say(`Edit mode: drop or paste (Ctrl+V) images anywhere on this page to add a lineup to ${label(st)}. Drag "Move" to reorder lineups, or drag an image to reorder within its lineup.`);
  idle(); addEventListener("hashchange",()=>{if(!pending.length)idle()});
  const tok=()=>{let t="";try{t=localStorage.getItem("nades-token")||""}catch(e){}
    if(!t){t=(prompt("Paste your GitHub token once (kept only in this browser):")||"").trim();try{if(t)localStorage.setItem("nades-token",t)}catch(e){}}return t};
  // GH-START
  let br=null;
  async function gh(path,opt={}){
    const r=await fetch(`https://api.github.com/repos/${R}${path?"/"+path:""}`,{cache:"no-store",...opt,headers:{Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json","Content-Type":"application/json"}});
    if(!r.ok){if(r.status==401)try{localStorage.removeItem("nades-token")}catch(e){};const e=new Error(r.status+" "+(await r.text()).slice(0,150));e.status=r.status;throw e}
    return r.json();
  }
  // One atomic commit per action (new images + map file + deletions together = one site rebuild).
  // plan(ctx) returns {write:{path:{text}|{b64}}, del:[paths]}. If the branch moved meanwhile, it re-plans and retries.
  async function commit(msg,plan){
    const blobs={};
    for(let n=0;;n++){
      br=br||await gh("").then(r=>r.default_branch,()=>"main");
      const head=(await gh(`git/ref/heads/${br}`)).object.sha, base=(await gh(`git/commits/${head}`)).tree.sha;
      const listDir=async dir=>{let sha=base;
        for(const seg of dir.split("/")){const e=(await gh(`git/trees/${sha}`)).tree.find(x=>x.path==seg&&x.type=="tree");if(!e)return new Set();sha=e.sha}
        return new Set((await gh(`git/trees/${sha}`)).tree.filter(x=>x.type=="blob").map(x=>x.path))};
      const {write={},del=[]}=await plan({read:async p=>dec((await gh(`contents/${p}?ref=${head}`)).content),files:listDir});
      const tree=[], ks=Object.keys(write), nimg=ks.filter(p=>write[p].b64!=null).length;
      for(const p of ks){
        const v=write[p];
        if(v.text!=null){tree.push({path:p,mode:"100644",type:"blob",content:v.text});continue}
        if(!blobs[p]){say(`Uploading image ${Object.keys(blobs).length+1} of ${nimg}...`);
          blobs[p]=(await gh("git/blobs",{method:"POST",body:JSON.stringify({content:v.b64,encoding:"base64"})})).sha}
        tree.push({path:p,mode:"100644",type:"blob",sha:blobs[p]});
      }
      del.forEach(p=>tree.push({path:p,mode:"100644",type:"blob",sha:null}));
      if(!tree.length)return;
      say("Committing...");
      const nt=await gh("git/trees",{method:"POST",body:JSON.stringify({base_tree:base,tree})});
      const nc=await gh("git/commits",{method:"POST",body:JSON.stringify({message:msg,tree:nt.sha,parents:[head]})});
      try{await gh(`git/refs/heads/${br}`,{method:"PATCH",body:JSON.stringify({sha:nc.sha})});return}
      catch(e){if(e.status!=422||n>=2)throw e}
    }
  }
  const mutate=(map,fn,msg)=>commit(msg,async ctx=>{const p=`maps/${map}.html`,o=await ctx.read(p),n=fn(o);return n==o?{}:{write:{[p]:{text:n}}}});
  // GH-END
  const cached=(map,src)=>[...(docs[map]?docs[map].querySelectorAll("article"):[])].find(x=>x.querySelector("img")?.getAttribute("src")==src);
  async function shrink(f){
    const bm=await createImageBitmap(f), k=Math.min(1,MAXW/bm.width), c=document.createElement("canvas");
    c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
    c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));
    return {b64:b64(new Uint8Array(await b.arrayBuffer())),url:URL.createObjectURL(b)};
  }
  function paint(){
    $("#df").hidden=!pending.length; $("#dth").replaceChildren();
    pending.forEach((f,i)=>{const im=document.createElement("img");im.src=URL.createObjectURL(f);
      im.title="Click to remove";im.onclick=()=>{pending.splice(i,1);paint()};$("#dth").append(im)});
    pending.length?say(`Adding ${pending.length} image(s) to ${label(dest)}`):idle();
  }
  async function live(url){   // just a status check: wait until the rebuilt site serves the new file
    for(let i=0;i<36;i++){
      await new Promise(r=>setTimeout(r,5000));
      try{const r=await fetch(url+"?t="+Date.now(),{cache:"no-store"});if(r.ok){if(!pending.length)say("Live on the site.");return}}catch(e){}
    }
    if(!pending.length)say("Saved, but the site is still rebuilding. Reload in a minute or two.");
  }
  addEventListener("dragover",e=>e.preventDefault());
  const addFiles=fs=>{
    fs=fs.filter(f=>f&&f.type.startsWith("image/")); if(!fs.length)return false;
    if(!pending.length)dest={...st};
    pending=pending.concat(fs).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    paint();$("#dt").focus();return true;
  };
  addEventListener("drop",e=>{e.preventDefault();addFiles([...e.dataTransfer.files])});
  addEventListener("paste",e=>{   // Ctrl+V of an image (screenshot or copied file); plain text pastes are left alone
    const cd=e.clipboardData; if(!cd)return;
    let fs=[...cd.files];
    if(!fs.length)fs=[...cd.items].filter(i=>i.kind=="file").map(i=>i.getAsFile());
    if(addFiles(fs))e.preventDefault();
  });
  const cl=document.createElement("button");cl.textContent="Clean up unused images";cl.style.cssText="font-size:12px;margin-bottom:8px";
  cl.title="Delete files in img/<map>/ that no lineup on this map uses";$("#dh").after(cl);
  cl.onclick=async()=>{
    const map=st.map; let n=0;
    try{
      say(`Checking img/${map}/ ...`);
      await commit("Remove unused images: "+map,async ctx=>{
        const dir=`img/${map}`,used=new Set(srcsOf(await ctx.read(`maps/${map}.html`))),files=await ctx.files(dir);
        const del=[...files].filter(f=>/\.(jpe?g|png|webp|gif)$/i.test(f)&&!used.has(`${dir}/${f}`)).map(f=>`${dir}/${f}`);
        if(!del.length){say(`No unused images in ${dir}/.`);return {}}
        if(!confirm(`Permanently delete ${del.length} unused image file(s) from ${dir}/ ?\n\n`+del.slice(0,8).map(x=>x.split("/").pop()).join("\n")+(del.length>8?"\n...":""))){say("Cancelled.");return {}}
        n=del.length;return {del}});
      if(n)say(`Removed ${n} unused image(s) from ${map}. The live site updates in about a minute.`);
    }catch(err){say("Failed: "+err.message)}
  };
  $("#dc").onclick=()=>{pending=[];$("#dt").value="";paint()};
  $("#dk").onclick=()=>{try{localStorage.removeItem("nades-token")}catch(e){};tok()};
  $("#ds").onclick=async()=>{
    const title=$("#dt").value.trim().replace(/\s+/g," ");
    if(!title)return say("Type a title first.");
    if(!tok())return say("A token is needed to save.");
    const {map,side,loc}=dest, id=Date.now().toString(36),
      slug=title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"lineup";
    try{
      const names=[], write={}, urls={};
      for(let i=0;i<pending.length;i++){
        say(`Preparing image ${i+1} of ${pending.length}...`);
        const n=`${side}-${loc}-${slug}-${id}-${i+1}.jpg`, p=`img/${map}/${n}`, o=await shrink(pending[i]);
        write[p]={b64:o.b64}; urls[p]=o.url; names.push(n);
      }
      const art=mkArt(title,map,names), mp=`maps/${map}.html`;
      await commit("Add lineup: "+title,async ctx=>{   // map file is checked first, so a bad section never leaves orphan images
        write[mp]={text:addTo(await ctx.read(mp),side,loc,art)};return {write}});
      Object.assign(local,urls);   // show the new lineup right away from the local copies
      if(docs[map]){const sec=docs[map].querySelector(`section[data-side="${side}"][data-loc="${loc}"]`);
        if(sec){const tp=document.createElement("template");tp.innerHTML=art;sec.append(tp.content.firstElementChild)}}
      pending=[];$("#dt").value="";paint();
      if(st.map==map&&st.side==side&&st.loc==loc)render();
      say("Saved in a single commit. Shown here already; the live site updates in about a minute...");
      live(`img/${map}/${names[0]}`);
    }catch(err){say("Failed: "+err.message)}
  };
  window.addDel=c=>{
    const src=c.querySelector("img")?.dataset.orig||c.querySelector("img")?.getAttribute("src"), h=c.querySelector("h3"), map=st.map, row=document.createElement("div");
    row.className="row";row.style.marginBottom="8px";
    const mk2=(t,fn)=>{const b=document.createElement("button");b.textContent=t;b.style.fontSize="12px";
      b.onclick=async()=>{try{await fn()}catch(err){say("Failed: "+err.message)}};row.append(b)};
    mk2("Rename",async()=>{
      const nt=(prompt("New title:",h.textContent)||"").trim().replace(/\s+/g," "); if(!nt||nt==h.textContent)return;
      say("Renaming..."); await mutate(map,t=>retitle(t,src,nt,h.textContent),"Rename lineup");
      const a=cached(map,src); if(a)a.querySelector("h3").textContent=nt; render();
      say("Renamed and saved. The live site updates in about a minute; it is already shown here.");
    });
    mk2("Delete",async()=>{
      const title=h.textContent;
      if(!confirm('Delete "'+title+'" and its image files from the repository?'))return;
      say("Deleting..."); let n=0;
      await commit("Delete lineup: "+title,async ctx=>{
        const p=`maps/${map}.html`,t=await ctx.read(p),del=[],dirs={};
        for(const f of ownImgs(t,src,title)){const d=f.slice(0,f.lastIndexOf("/"));dirs[d]=dirs[d]||await ctx.files(d);if(dirs[d].has(f.slice(d.length+1)))del.push(f)}
        n=del.length;return {write:{[p]:{text:dropAt(t,src,title)}},del}});
      cached(map,src)?.remove(); render();
      say(`Deleted. ${n} image file(s) removed from the repository. The live site updates in about a minute.`);
    });
    const half=(e,el,vert)=>{const r=el.getBoundingClientRect();return vert?e.clientY<r.top+r.height/2:e.clientX<r.left+r.width/2};
    const saved=()=>say("Order saved. The live site updates in about a minute; it is already shown here.");
    // Reorder whole lineups (up/down): drag the "Move" handle onto another lineup
    const hd=document.createElement("span");hd.className="handle";hd.textContent="\u283F Move";hd.title="Drag to reorder this lineup";hd.draggable=true;
    hd.ondragstart=e=>{drag={k:"art",c,src,title:h.textContent};e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","lineup");e.dataTransfer.setDragImage(h,10,10);c.classList.add("dragging")};
    hd.ondragend=()=>{drag=null;c.classList.remove("dragging");clearMarks()};
    row.prepend(hd);
    c.addEventListener("dragover",e=>{
      if(!drag||drag.k!="art"||drag.c===c)return;
      e.preventDefault();clearMarks();c.classList.add(half(e,c,true)?"drop-before":"drop-after");
    });
    c.addEventListener("drop",async e=>{
      if(!drag||drag.k!="art"||drag.c===c)return;
      e.preventDefault();e.stopPropagation();
      const d=drag,before=half(e,c,true);drag=null;clearMarks();
      try{
        say("Saving new order...");
        await mutate(map,t=>moveArt(t,d.src,d.title,src,h.textContent,before),"Reorder lineups");
        const A=cached(map,d.src),B=cached(map,src); if(A&&B)before?B.before(A):B.after(A);
        keepY=scrollY;render();saved();
      }catch(err){say("Failed: "+err.message)}
    });
    // Reorder images inside a lineup (left/right): drag an image onto another image of the same lineup
    const imgs=[...c.querySelectorAll("img")];
    imgs.forEach((im,i)=>{
      im.draggable=true;
      im.addEventListener("dragstart",e=>{drag={k:"img",c,i};e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","image");im.classList.add("dragging")});
      im.addEventListener("dragend",()=>{drag=null;im.classList.remove("dragging");clearMarks()});
      im.addEventListener("dragover",e=>{
        if(!drag||drag.k!="img"||drag.c!==c||drag.i==i)return;
        e.preventDefault();clearMarks();im.classList.add(half(e,im,false)?"drop-before":"drop-after");
      });
      im.addEventListener("drop",async e=>{
        if(!drag||drag.k!="img"||drag.c!==c||drag.i==i)return;
        e.preventDefault();e.stopPropagation();
        const from=drag.i,before=half(e,im,false);drag=null;clearMarks();
        let to=i>from?i-1:i; if(!before)to++;
        if(to==from)return;
        try{
          say("Saving new order...");
          await mutate(map,t=>moveImg(t,src,h.textContent,from,to,imgs.length),"Reorder images");
          const a=cached(map,src);
          if(a){const L=[...a.querySelectorAll("img")];before?L[i].before(L[from]):L[i].after(L[from])}
          keepY=scrollY;render();saved();
        }catch(err){say("Failed: "+err.message)}
      });
    });
    h.after(row);
  };
}

addEventListener("hashchange",render);
if(!location.hash){try{const l=localStorage.getItem("nades-last");if(l)history.replaceState(null,"",l)}catch(e){}}
render();
</script>
